version: '3.8'

services:
  voiceguard-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: voiceguard-backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    # If deploying on a host with NVIDIA GPU, uncomment the deploy section below:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
